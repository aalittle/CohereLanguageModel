name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Build & test CohereAPI (stock toolchain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Toolchain info
        run: swift --version && xcodebuild -version
      # The adapter target is gated with `#if compiler(>=6.4)` (Xcode 27
      # beta), so on stock toolchains it compiles to an empty module and
      # the whole package builds here. Add a beta-SDK job (and drop the
      # gate) once runners carry Xcode 27.
      - name: Build
        run: swift build
      - name: Test
        run: swift test
